server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API 反代到 compose 中的 api 服务
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /health {
        proxy_pass http://api:8000/health;
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
