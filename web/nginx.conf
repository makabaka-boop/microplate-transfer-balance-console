server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 单页应用回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 计算请求交给 api 容器（compose 服务名 api）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
